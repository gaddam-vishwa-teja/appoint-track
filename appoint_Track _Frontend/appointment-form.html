<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Appointment - AppointTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">AppointTrack</div>
        <ul class="navbar-nav">
            <li class="nav-item"><a href="appointments.html" class="nav-link">Appointments</a></li>
            <li class="nav-item"><a href="profile.html" class="nav-link">Profile</a></li>
            <li class="nav-item"><button class="nav-link logout-btn">Logout</button></li>
        </ul>
    </nav>
    <div class="container">
        <header>
            <h1>Add New Appointment</h1>
            <p>Fill in the details for your new appointment</p>
        </header>
        <div class="appointment-form">
            <form id="addAppointmentForm">
                <div class="form-group">
                    <label for="doctor-name">Doctor's Name:</label>
                    <input type="text" id="doctor-name" name="doctor-name" required>
                </div>
                <div class="form-group">
                    <label for="appointment-date">Date & Time:</label>
                    <input type="datetime-local" id="appointment-date" name="appointment-date" required>
                </div>
                <div class="form-group">
                    <label for="reason">Reason for Visit:</label>
                    <input type="text" id="reason" name="reason">
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" name="status">
                        <option value="Upcoming">Upcoming</option>
                        <option value="Past">Past</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <button type="submit">Add Appointment</button>
                <div class="cancel-button">
                    <a href="appointments.html">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
