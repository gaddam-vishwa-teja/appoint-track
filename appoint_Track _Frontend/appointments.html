<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - AppointTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">AppointTrack</div>
        <ul class="navbar-nav">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="appointments.html" class="nav-link active">Appointments</a></li>
            <li class="nav-item"><a href="profile.html" class="nav-link">Profile</a></li>
            <li class="nav-item"><button class="nav-link logout-btn">Logout</button></li>
        </ul>
    </nav>
    <div class="container">
        <header>
            <h1>Your Appointments</h1>
            <p>Manage and view your medical appointments</p>
        </header>
        <div class="search-filters">
            <input type="text" id="search-doctor" placeholder="Search by Doctor">
            <select id="filter-status">
                <option value="">All Statuses</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Past">Past</option>
            </select>
            <button onclick="applyFilters()">Apply Filters</button>
        </div>
        <div id="appointment-list">
        </div>
        <div class="add-appointment-button">
            <a href="appointment-form.html">Add New Appointment</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
