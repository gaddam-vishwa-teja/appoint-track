{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - AppointTrack</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    
    <link rel="stylesheet" href="{% static 'appointments/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'appointments/css/homepage.css' %}">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    {% comment %} <form method="POST" action="">
        {% csrf_token %}
        <input type="text" name="name" required>
        <input type="email" name="email" required>
        <input type="date" name="date" required>
        <input type="time" name="time" required>
        <textarea name="message"></textarea>
        <button type="submit">Submit</button>
      </form>
      
      {% if success %}
          <p>Appointment booked successfully!</p>
      {% endif %} {% endcomment %}
      
    <nav class="navbar">
        <div class="navbar-brand">AppointTrack</div>
        <ul class="navbar-nav">
            <li class="nav-item"><a href="{% url 'index' %}" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="{% url 'appointments' %}" class="nav-link active">Appointments</a></li>
            <li class="nav-item"><a href="{% url 'profile' %}" class="nav-link">Profile</a></li>
            <li class="nav-item"><button class="nav-link logout-btn">Logout</button></li>
        </ul>
    </nav>
    <div class="container">
        <header>
            <h1>Your Appointments</h1>
            <p>Manage and view your medical appointments</p>
        </header>
        <div class="search-filters">
            <input type="text" id="search-doctor" placeholder="Search by Doctor">
            <select id="filter-status">
                <option value="">All Statuses </option>
                <option value="Upcoming">Upcoming</option>
                <option value="Past">Past</option>
            </select>
            <button onclick="applyFilters()">Apply Filters</button>
        </div>
        <div id="appointment-list">
        </div>
        <div class="add-appointment-button">
            <a href="{% url 'appointment_form' %}">Add New Appointment</a>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="{% static 'appointments/js/script.js' %}"></script>
</body>

</html>
